name: Admin receipt type sync (temporary)

on:
  push:
    branches:
      - work/admin-reconcile-20260916045708960

permissions:
  contents: write

concurrency:
  group: admin-receipt-type-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
        with:
          ref: work/admin-reconcile-20260916045708960
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Start disposable Supabase
        run: supabase start

      - name: Generate and commit exact database types
        shell: bash
        run: |
          set -euo pipefail
          supabase gen types typescript --local > /tmp/database.types.ts
          node scripts/normalize-database-types.mjs /tmp/database.types.ts
          if cmp -s lib/database.types.ts /tmp/database.types.ts; then
            echo "Database types already match."
            exit 0
          fi
          cp /tmp/database.types.ts lib/database.types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/database.types.ts
          git commit -m "Sync generated database types for admin receipt RPCs"
          git push origin HEAD:work/admin-reconcile-20260916045708960

      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
