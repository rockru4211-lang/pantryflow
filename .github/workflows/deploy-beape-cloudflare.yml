name: Deploy 百花猿 to Cloudflare
on:
  push:
    branches: [beape]
  workflow_dispatch:
concurrency:
  group: deploy-beape-cloudflare
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qckwzwyeqpuqogbydvvl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GAwSlsaboa7QAn4P2jP0Vg_8WRC38vN
      NEXT_PUBLIC_APP_ENV: beta
      NEXT_PUBLIC_BUILD_BRANCH: beape
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
      - name: Verify types
        run: npm run typecheck
      - name: Recipe regression tests
        run: node --experimental-strip-types --test tests/recipe-cost.test.mjs tests/recipe-tools.test.mjs tests/ingredient-baseline-groups.test.mjs tests/ingredient-price-sheet.test.mjs tests/ingredient-price-sheet-ui.test.mjs tests/ingredient-prices-workspace.test.mjs tests/coalesced-read.test.mjs tests/ingredient-catalog.test.mjs tests/operations-sheet.test.mjs tests/unified-price-calculation.test.mjs tests/admin-desktop-workflow.test.mjs
      - name: Check recipe changes
        run: npx eslint lib/recipe-cost.ts lib/recipe-price-draft.ts lib/recipe-export.ts lib/recipe-tools-state.ts app/pilot/recipe-tools.tsx app/pilot/recipes-workspace.tsx app/pilot/recipe-editor.tsx
      - name: Build exact commit
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Deploy beape-ops
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare secrets 尚未設定，無法部署。"
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npx wrangler deploy --name beape-ops
      - name: Verify live source and asset graph
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          PRODUCTION_VERIFY_ATTEMPTS: '6'
        run: node scripts/verify-receipt-accounting-production.mjs
