name: Deploy PantryFlow to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp deployment version
        env:
          APP_VERSION: pilot-v0.1
        run: |
          printf '%s\n' \
            '{' \
            "  \"version\": \"${APP_VERSION}\"," \
            "  \"commit\": \"${GITHUB_SHA}\"," \
            "  \"runNumber\": \"${GITHUB_RUN_NUMBER}\"," \
            "  \"deployedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"" \
            '}' > build-info.json
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
