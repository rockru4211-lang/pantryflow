name: Deploy PantryFlow to GitHub Pages

on:
  push:
    branches: [pilot-v1-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == 'pilot-v1-preview'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stamp preview build
        working-directory: pilot-v1
        run: printf 'window.PILOT_BUILD={branch:%s,sha:%s};\n' '"${{ github.ref_name }}"' '"${{ github.sha }}"' > build-info.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pilot-v1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
