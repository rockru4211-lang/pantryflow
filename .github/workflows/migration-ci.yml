name: Merchant beta verification

on:
  push:
    branches:
      - main
      - feat/merchant-beta
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merchant-beta-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_BUILD_BRANCH: ${{ github.ref_name }}
      NEXT_PUBLIC_SUPABASE_URL: https://qckwzwyeqpuqogbydvvl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SCHEMA_VERSION: 20260907_merchant_beta_v7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply final count V2.1 wording cleanup
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 38
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" "origin/${HEAD_REF}"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/pilot/count-workspace.tsx')
          s=p.read_text()
          s=s.replace('>查看本次盤點明細</button>', '>查看結果</button>')
          s=s.replace(', canImport = canManage, businessType = "SINGLE_RESTAURANT", initialSessionId,', ', canImport = canManage, initialSessionId,')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- app/pilot/count-workspace.tsx; then
            git add app/pilot/count-workspace.tsx
            git commit -m "Finalize count V2.1 result wording"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify migration inventory
        shell: bash
        run: |
          migration_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          test "$migration_count" -gt "27"
          npm run verify:source

      - name: Start clean local Supabase and apply migrations
        run: supabase start

      - name: Rebuild database from all migrations
        run: supabase db reset --local

      - name: Verify RLS, RPCs, and schema contract
        run: supabase test db

      - name: Verify generated database types are current
        shell: bash
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          node scripts/normalize-database-types.mjs /tmp/database.types.ts
          node scripts/verify-database-types.mjs lib/database.types.ts /tmp/database.types.ts

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Automated tests
        run: npm test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
