name: Merchant beta verification

on:
  push:
    branches:
      - main
      - feat/merchant-beta
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merchant-beta-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_BUILD_BRANCH: ${{ github.ref_name }}
      NEXT_PUBLIC_SUPABASE_URL: https://qckwzwyeqpuqogbydvvl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_SCHEMA_VERSION: 20260907_merchant_beta_v7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply count V2.1 UI to PR 38 test branch
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 38
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" "origin/${HEAD_REF}"
          if [ -f scripts/apply-count-v21-ui.mjs ]; then
            node scripts/apply-count-v21-ui.mjs
            rm scripts/apply-count-v21-ui.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/pilot/count-workspace.tsx scripts/apply-count-v21-ui.mjs
            git commit -m "Apply count V2.1 finalized UI flow"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify migration inventory
        shell: bash
        run: |
          migration_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          test "$migration_count" -gt "27"
          npm run verify:source

      - name: Start clean local Supabase and apply migrations
        run: supabase start

      - name: Rebuild database from all migrations
        run: supabase db reset --local

      - name: Verify RLS, RPCs, and schema contract
        run: supabase test db

      - name: Generate normalized database types
        shell: bash
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          node scripts/normalize-database-types.mjs /tmp/database.types.ts

      - name: Sync generated types to PR 38 test branch
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 38
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_REF}"
          git checkout -B "${HEAD_REF}" "origin/${HEAD_REF}"
          if ! cmp -s lib/database.types.ts /tmp/database.types.ts; then
            cp /tmp/database.types.ts lib/database.types.ts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/database.types.ts
            git commit -m "Sync database types for count V2.1"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Verify generated database types are current
        run: node scripts/verify-database-types.mjs lib/database.types.ts /tmp/database.types.ts

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Automated tests
        run: npm test

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
