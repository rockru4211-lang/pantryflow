name: Public demo frontend verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/public-demo-checks.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_SUPABASE_URL: https://qckwzwyeqpuqogbydvvl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm ci --cache .sites-runtime/npm-cache
      - name: Preserve locked dependency cache for reproducible verification
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-locked-npm-cache
          path: .sites-runtime/npm-cache/_cacache
          retention-days: 2
          include-hidden-files: true
      - run: npm run verify:source
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
