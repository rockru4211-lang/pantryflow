name: Public demo frontend verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/public-demo-checks.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_PUBLIC_SUPABASE_URL: https://qckwzwyeqpuqogbydvvl.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm ci --cache .sites-runtime/npm-cache
      - name: Preserve exact reviewed source for the deployment mirror
        run: git bundle create /tmp/public-demo-source.bundle HEAD ^fff7f30aca1f3032d4b5e4525541eb6af821b3ed
      - uses: actions/upload-artifact@v4
        with:
          name: public-demo-reviewed-source
          path: /tmp/public-demo-source.bundle
          retention-days: 2
      - run: npm run verify:source
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
