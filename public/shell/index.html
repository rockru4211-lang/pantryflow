<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="序｜完整 App 外殼預覽：連鎖與獨立餐廳身分、功能入口與手機優先導覽。">
  <title>序｜完整 App 外殼</title>
  <link rel="stylesheet" href="./design-tokens.css">
  <link rel="stylesheet" href="./app-shell.css">
</head>
<body>
  <aside class="preview-toolbar" aria-label="外殼預覽控制">
    <div><strong>序｜完整 App 外殼</strong><span data-business-summary>僅供畫面與導覽確認，不連接真實資料</span></div>
    <nav class="business-switch" aria-label="切換餐廳類型">
      <button type="button" data-business="CHAIN_RESTAURANT">連鎖餐飲</button>
      <button type="button" data-business="INDEPENDENT_RESTAURANT">獨立餐廳</button>
    </nav>
    <nav class="store-count-switch" aria-label="切換門市數量">
      <button type="button" data-store-count="1">單店</button>
      <button type="button" data-store-count="2">多店</button>
    </nav>
    <nav class="role-switch" aria-label="切換預覽身份">
      <button type="button" data-auth-preview>登入／註冊</button>
      <button type="button" data-role="STAFF">員工</button>
      <button type="button" data-role="SUPERVISOR">店長</button>
      <button type="button" data-role="LOGISTICS">區主管</button>
      <button type="button" data-role="OWNER">老闆</button>
      <button type="button" data-role="FINANCE" hidden disabled>財務（未來）</button>
    </nav>
  </aside>
  <div id="shell-root" aria-live="polite"></div>
  <div id="shell-toast" class="shell-toast" role="status" aria-live="polite"></div>
  <footer id="shell-build" class="shell-build">外殼版本載入中</footer>
  <script src="./build-info.js"></script>
  <script type="module" src="./app-shell.js"></script>
</body>
</html>
