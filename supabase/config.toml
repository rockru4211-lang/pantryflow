project_id = "pantryflow-beta"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
enabled = true
minimum_password_length = 8
site_url = "https://pantryflow.rockru4211.workers.dev"
# Required production Auth allow list; verify the hosted project separately.
additional_redirect_urls = [
  "https://pantryflow.rockru4211.workers.dev/",
  "https://pantryflow.rockru4211.workers.dev/?auth=recovery",
  "https://pantryflow.rockru4211.workers.dev/?auth=signup",
  "https://pantryflow.rockru4211.workers.dev/?auth=google",
  "https://pantryflow.rockru4211.workers.dev/?auth=invite",
]

[functions.process-receipt-ocr]
verify_jwt = true

[functions.enqueue-receipt-ocr]
# JWTs are verified with Auth; scheduled calls use a dedicated Vault secret.
verify_jwt = false

[functions.process-inventory-pdf]
verify_jwt = true
