<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryFlow｜盤點閉環驗收</title><link rel="stylesheet" href="../../pilot-v1/design-tokens.css"></head><body><header class="build-banner">PantryFlow</header><main id="app"></main><script type="module">

const data={sessions:[{id:'session-1',status:manager&&stage==='difference'?'REVIEWING':'IN_PROGRESS',opening_source:'LAST_APPROVED_COUNT',task_date:'2026-08-24'}],zones:[{id:'cold',name:'冷藏庫'},{id:'dry',name:'乾貨區'}],products:[{id:'ham',name:'火腿',product_code:'HAM-001',count_unit:'包',base_unit:'箱',is_active:true},{id:'oil',name:'鮮奶油',product_code:'CRM-001',count_unit:'瓶',base_unit:'箱',is_active:true}],assignments:[{zone_id:'cold',product_id:'ham'},{zone_id:'cold',product_id:'oil'}],progress:[{session_id:'session-1',zone_id:'cold',status:stage==='difference'?'COMPLETED':'IN_PROGRESS'},{session_id:'session-1',zone_id:'dry',status:stage==='difference'?'COMPLETED':'NOT_STARTED'}],drafts:[{session_id:'session-1',zone_id:'cold',product_id:'ham',quantity:0,unit:'包'}],discrepancies:[{id:'d1',product_id:'ham',previous_quantity:10,estimated_quantity:8,difference:-2}]};

</script></body></html>
