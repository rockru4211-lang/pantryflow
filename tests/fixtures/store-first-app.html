<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PantryFlow｜門市優先路由驗收</title>
  <link rel="stylesheet" href="../../pilot-v1/design-tokens.css">
</head>
<body>
  <header id="build-banner" class="build-banner">PantryFlow</header>
  <main id="app"></main>
  <footer id="build-version" class="build-version"></footer>
  <script>
    (() => {
      const fixtureState = new URLSearchParams(location.search).get('state') || 'signed-out';
      const userId = '11111111-1111-4111-8111-111111111111';
      const organizationId = '22222222-2222-4222-8222-222222222222';
      const storeId = '33333333-3333-4333-8333-333333333333';
      const hasSession = fixtureState !== 'signed-out';
      const hasOrganization = !['signed-out', 'no-organization'].includes(fixtureState);
      const hasStore = fixtureState === 'has-store';

      const rows = table => ({
        profiles: [{
          id: userId,
          organization_id: hasOrganization ? organizationId : null,
          display_name: '本機管理者',
          role: hasOrganization ? 'ADMIN' : null,
        }],
        organization_members: hasOrganization ? [{
          organization_id: organizationId,
          user_id: userId,
          role: 'ADMIN',
          is_active: true,
          is_owner: true,
        }] : [],
        organizations: hasOrganization ? [{
          id: organizationId,
          name: '本機驗收商家',
          business_type: 'SINGLE_RESTAURANT',
        }] : [],
        store_memberships: hasStore ? [{
          store_id: storeId,
          organization_id: organizationId,
          user_id: userId,
          login_identifier: 'manager-local',
          role: 'ADMIN',
          is_active: true,
        }] : [],
        stores: hasStore ? [{
          id: storeId,
          name: '本機驗收門市',
          store_code: 'LOCAL01',
          staff_login_mode: 'NAME_OR_NICKNAME',
          is_active: true,
        }] : [],
        staff_identities: [],
      }[table] || []);

      const query = table => {
        const filters = [];
        const builder = {
          select() { return builder; },
          eq(column, value) { filters.push(row => row[column] === value); return builder; },
          in(column, values) { filters.push(row => values.includes(row[column])); return builder; },
          order() { return builder; },
          limit() { return builder; },
          maybeSingle() {
            const data = rows(table).filter(row => filters.every(filter => filter(row)))[0] || null;
            return Promise.resolve({ data, error: null });
          },
          single() {
            const data = rows(table).filter(row => filters.every(filter => filter(row)))[0] || null;
            return Promise.resolve({ data, error: data ? null : { message: 'FIXTURE_ROW_MISSING' } });
          },
          then(resolve, reject) {
            return Promise.resolve({
              data: rows(table).filter(row => filters.every(filter => filter(row))),
              error: null,
            }).then(resolve, reject);
          },
        };
        return builder;
      };

      window.PANTRYFLOW_CONFIG = { supabaseUrl: 'https://fixture.invalid', supabaseAnonKey: 'fixture-public-key' };
      window.PILOT_BUILD = { branch: 'local-fixture', sha: 'fixture', deployedAt: 'not-deployed' };
      window.supabase = { createClient: () => ({
        auth: {
          getSession: async () => ({ data: { session: hasSession ? { user: { id: userId } } : null }, error: null }),
          signOut: async () => ({ error: null }),
        },
        from: query,
        functions: { invoke: async () => ({ data: null, error: { message: 'FIXTURE_WRITE_FORBIDDEN' } }) },
        rpc: async () => ({ data: null, error: { message: 'FIXTURE_WRITE_FORBIDDEN' } }),
      }) };
    })();
  </script>
  <script type="module" src="../../pilot-v1/app.js"></script>
</body>
</html>
